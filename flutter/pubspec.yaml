name: biblia_inteligente
description: "Biblia Inteligente (Digital Sanctuary) - Lector bíblico y santuario personal con arquitectura limpia."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Networking & HTTP
  http: ^1.2.1

  # Local Persistence (Drift / SQLite)
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  path: ^1.9.0

  # Native Integrations & Sharing
  share_plus: ^9.0.0
  home_widget: ^0.6.0

  # Typography & Iconography
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.1.17
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.16.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/data/
    - assets/data/rv1858_json/
    - assets/data/sse_json/
    - assets/data/valera_json/
