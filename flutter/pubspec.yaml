name: biblia_inteligente
description: "Biblia Inteligente (Santuario Digital) – Bible reader and personal sanctuary with clean architecture."
publish_to: "none"

# Versión 1.0.0 (Build 1) - Primera versión oficial para despliegue y tiendas de aplicaciones
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter

  # Local SQLite & Drift Persistence (CRITICAL: Preserved for database stability)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24

  # UI, Icons, Typography & Animations
  flutter_animate: ^4.5.2
  flutter_markdown: ^0.7.4+1
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.1.19

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # AI & Cloud Services
  google_generative_ai: ^0.4.7
  http: ^1.2.2

  # Native Integrations, Widgets & Review/Update
  flutter_secure_storage: ^9.2.2
  home_widget: ^0.7.0
  in_app_review: ^2.0.9
  in_app_update: ^4.2.3
  package_info_plus: ^8.1.0
  path: ^1.9.1
  path_provider: ^2.1.4
  share_plus: ^10.1.4
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.4.11
  change_app_package_name: ^1.5.0
  drift_dev: ^2.18.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/icon/
    - assets/data/
    - assets/data/rvr1960_json/
    - assets/data/rva2015_json/
    - assets/data/valera_json/

