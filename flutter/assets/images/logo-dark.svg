
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgDarkGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0B0F19" />
    </radialGradient>
    <radialGradient id="sunGlowGrad" cx="50%" cy="85%" r="75%">
      <stop offset="0%" stop-color="#F47B20" />
      <stop offset="100%" stop-color="#E65100" />
    </radialGradient>
    <linearGradient id="waveNavyGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2B3990" />
      <stop offset="50%" stop-color="#3B49A8" />
      <stop offset="100%" stop-color="#5465D4" />
    </linearGradient>
    <linearGradient id="waveCyanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0080C8" />
      <stop offset="50%" stop-color="#00AEEF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgDarkGrad)" />

  <!-- Centered Logo Group scaled to fit 512x512 -->
  <g transform="translate(46, 50) scale(0.84)">
    <!-- Sunburst Rays with White Cross Negative Space -->
    <g id="sunburst-rays">
      <!-- Ray 1 Far Left -->
      <path d="M 45 220 C 60 170, 100 130, 150 100 L 195 145 C 160 170, 125 195, 80 230 Z" fill="url(#sunGlowGrad)" />
      <!-- Ray 2 Mid-Left -->
      <path d="M 120 115 C 165 75, 215 50, 260 40 L 250 110 C 215 118, 180 138, 145 168 Z" fill="url(#sunGlowGrad)" />
      <!-- Ray 3 Center-Left (Cross Beam Cutout) -->
      <path d="M 215 45 L 240 40 L 240 85 L 205 85 L 205 105 L 240 105 L 240 240 L 195 235 Z" fill="url(#sunGlowGrad)" />
      <!-- Ray 4 Center-Right (Cross Beam Cutout) -->
      <path d="M 285 45 L 260 40 L 260 85 L 295 85 L 295 105 L 260 105 L 260 240 L 305 235 Z" fill="url(#sunGlowGrad)" />
      <!-- Ray 5 Mid-Right -->
      <path d="M 380 115 C 335 75, 285 50, 240 40 L 250 110 C 285 118, 320 138, 355 168 Z" fill="url(#sunGlowGrad)" />
      <!-- Ray 6 Far Right -->
      <path d="M 455 220 C 440 170, 400 130, 350 100 L 305 145 C 340 170, 375 195, 420 230 Z" fill="url(#sunGlowGrad)" />
    </g>

    <!-- Primary Navy Wave Ribbon -->
    <path
      d="M 15 200 C 65 260, 175 250, 260 235 C 350 220, 430 245, 485 270 C 440 285, 340 260, 260 270 C 170 282, 80 270, 15 200 Z"
      fill="url(#waveNavyGradient)"
    />

    <!-- Secondary Vivid Cyan Water Ribbon -->
    <path
      d="M 125 285 C 200 295, 305 280, 380 275 C 425 272, 445 282, 460 295 C 430 308, 370 290, 300 295 C 220 300, 160 298, 125 285 Z"
      fill="url(#waveCyanGradient)"
    />

    <!-- Text: El-Shaddai -->
    <text x="250" y="380" font-family="Georgia, serif" font-size="52" font-style="italic" font-weight="bold" fill="#FFFFFF" text-anchor="middle">El-Shaddai</text>
    
    <!-- Text: DIOS TODOPODEROSO -->
    <text x="250" y="420" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" letter-spacing="6" fill="#F47B20" text-anchor="middle">DIOS TODOPODEROSO</text>
  </g>
</svg>
